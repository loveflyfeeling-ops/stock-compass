name: 盤中報價更新
# GitHub 的排程常延遲或漏跑，所以改成「一天只要成功啟動一次」：
# 啟動後在同一個工作裡每 2 分鐘抓一次報價並推上 repo，一路跑到 13:35，最後再發布一次網站。
# 多排幾個備援啟動時間，任何一個有跑到就好；已在跑的時候，後來的會排隊、收盤後跑一輪就結束。
on:
  schedule:
    - cron: '45 0 * * 1-5'   # 台北 08:45
    - cron: '7 1 * * 1-5'    # 台北 09:07（備援）
    - cron: '37 1 * * 1-5'   # 台北 09:37（備援）
    - cron: '17 2 * * 1-5'   # 台北 10:17（備援）
    - cron: '17 3 * * 1-5'   # 台北 11:17（備援）
    - cron: '17 4 * * 1-5'   # 台北 12:17（備援）
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 盤中循環抓報價（到 13:35 為止）
        id: loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          now_min() { echo $(( 10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M) )); }
          END=$((13*60+35))
          changed=false
          while :; do
            git pull -q --rebase || true
            if python scripts/live.py; then
              git add data/live.json
              if ! git diff --cached --quiet; then
                git commit -q -m "盤中報價 $(TZ=Asia/Taipei date +'%F %H:%M')"
                for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
                changed=true
              fi
            fi
            [ "$(now_min)" -ge "$END" ] && break
            sleep 120
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.loop.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.loop.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.loop.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
